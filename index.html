<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>میرا آن لائن اسٹور</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:5}
header h1{margin:0 0 8px;font-size:24px}.cart{background:#fff;color:#111;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.container{max-width:1100px;margin:auto;padding:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select,button{font:inherit}input,select{padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff}
.search{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #00000012}.pic{height:190px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:60px}
.card-body{padding:14px}.price{font-weight:bold;font-size:20px;margin:8px 0}.buy{width:100%;padding:11px;border:0;border-radius:9px;background:#111;color:#fff;cursor:pointer}
#cartPanel{display:none;position:fixed;inset:0;background:#0008;z-index:10}.panel{background:#fff;width:min(480px,92%);height:100%;margin-right:auto;padding:20px;overflow:auto}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}
.close{float:left;border:0;background:#eee;border-radius:8px;padding:7px 10px}.checkout{background:#198754;color:white;border:0;border-radius:9px;padding:12px;width:100%;margin-top:10px}
label{display:block;margin-top:10px;font-weight:bold}
small{color:#666}
</style>
</head>
<body>
<header>
<h1>🛍️ میرا آن لائن اسٹور</h1>
<button class="cart" onclick="openCart()">🛒 کارٹ (<span id="count">0</span>)</button>
</header>

<main class="container">
<div class="toolbar">
<input id="search" class="search" placeholder="پروڈکٹ تلاش کریں..." oninput="render()">
<select id="category" onchange="render()"><option value="">تمام کیٹیگریز</option></select>
</div>
<div id="products" class="grid"></div>
</main>

<div id="cartPanel">
<div class="panel">
<button class="close" onclick="closeCart()">بند کریں</button>
<h2>آپ کا کارٹ</h2>
<div id="cartItems"></div>
<h3>کل: Rs. <span id="total">0</span></h3>
<hr>
<h3>آرڈر کی معلومات</h3>
<label>نام</label><input id="name" style="width:100%" placeholder="آپ کا نام">
<label>موبائل نمبر</label><input id="phone" style="width:100%" placeholder="03xxxxxxxxx">
<label>پتہ</label><input id="address" style="width:100%" placeholder="مکمل ڈیلیوری ایڈریس">
<button class="checkout" onclick="placeOrder()">WhatsApp پر آرڈر بھیجیں</button>
<small>نوٹ: WhatsApp نمبر نیچے JavaScript میں تبدیل کریں۔</small>
</div></div>

<script>
const WHATSAPP_NUMBER = "923001234567"; // اپنا WhatsApp نمبر یہاں لکھیں
const products = [
 {id:1,name:"پروڈکٹ 1",price:1500,cat:"General",emoji:"📦"},
 {id:2,name:"پروڈکٹ 2",price:2200,cat:"General",emoji:"👕"},
 {id:3,name:"پروڈکٹ 3",price:1200,cat:"General",emoji:"🎧"},
 {id:4,name:"پروڈکٹ 4",price:3000,cat:"General",emoji:"⌚"}
];
let cart=[];

function init(){
 const cats=[...new Set(products.map(p=>p.cat))];
 category.innerHTML='<option value="">تمام کیٹیگریز</option>'+cats.map(c=>`<option>${c}</option>`).join('');
 render();
}
function render(){
 const q=search.value.toLowerCase(), c=category.value;
 const list=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!c||p.cat===c));
 productsEl=document.getElementById('products');
 productsEl.innerHTML=list.map(p=>`
 <article class="card">
  <div class="pic">${p.emoji}</div>
  <div class="card-body">
   <h3>${p.name}</h3><small>${p.cat}</small>
   <div class="price">Rs. ${p.price.toLocaleString()}</div>
   <button class="buy" onclick="add(${p.id})">کارٹ میں شامل کریں</button>
  </div>
 </article>`).join('');
}
function add(id){const p=products.find(x=>x.id===id);const x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...p,qty:1});update();openCart()}
function update(){
 count.textContent=cart.reduce((s,x)=>s+x.qty,0);
 cartItems.innerHTML=cart.length?cart.map(x=>`<div class="item"><span>${x.name} × ${x.qty}</span><b>Rs. ${(x.price*x.qty).toLocaleString()}</b></div>`).join(''):'<p>کارٹ خالی ہے۔</p>';
 total.textContent=cart.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString();
}
function openCart(){cartPanel.style.display='block';update()}
function closeCart(){cartPanel.style.display='none'}
function placeOrder(){
 if(!cart.length)return alert('پہلے پروڈکٹ کارٹ میں شامل کریں۔');
 if(!name.value||!phone.value||!address.value)return alert('نام، موبائل اور پتہ مکمل کریں۔');
 let msg='نیا آرڈر%0A%0A';
 cart.forEach(x=>msg+=`${x.name} × ${x.qty} = Rs. ${x.price*x.qty}%0A`);
 msg+=`%0Aکل: Rs. ${cart.reduce((s,x)=>s+x.price*x.qty,0)}%0Aنام: ${name.value}%0Aموبائل: ${phone.value}%0Aپتہ: ${address.value}`;
 window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`,'_blank');
}
init();
</script>
</body>
</html>
